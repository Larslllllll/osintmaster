[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "osintmaster"
version = "0.3.0"
description = "Local OSINT investigation engine with evidence graphs and durable history"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "DATA_LICENSE.md"]
authors = [{name = "OSINTMaster contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet",
  "Topic :: Security",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "dnspython>=2.8,<3",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "platformdirs>=4,<6",
  "rich>=13,<15",
  "typer>=0.15,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.13,<3", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "twine>=6,<7"]

[project.scripts]
osintmaster = "osintmaster.cli:app"

[project.urls]
Repository = "https://github.com/Larslllllll/osintmaster"
Issues = "https://github.com/Larslllllll/osintmaster/issues"
Documentation = "https://github.com/Larslllllll/osintmaster#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/osintmaster"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "DATA_LICENSE.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml", "examples", "docs/architecture.md", "docs/roadmap.md", "assets"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["masterprompt.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["osintmaster"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
